<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">mjesar: Mohammad Ali Jesar, senior Ruby on Rails engineer for Shopify and e-commerce, AI agents, RAG and MCP</title>
  <desc id="d">Social preview image for github.com/mjesar in the look of the profile banner: the mjesar logo, the name Mohammad Ali Jesar, the line Senior Ruby on Rails Engineer, Shopify and E-commerce, AI Agents, RAG and MCP, and a network of nodes joined by a dashed thread on a field of dots.</desc>
  <defs>
    <!-- same background as banner.svg: a white dot grid and two sparser apricot glow grids -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.8" fill="#eef0f5" fill-opacity="0.28"/>
    </pattern>
    <pattern id="glow2" x="150" y="120" width="264" height="264" patternUnits="userSpaceOnUse">
      <circle cx="132" cy="132" r="7" fill="#f68c50" fill-opacity="0.14"/>
      <circle cx="132" cy="132" r="2.2" fill="#f68c50" fill-opacity="0.8"/>
    </pattern>
    <pattern id="glow1" x="66" y="44" width="216" height="216" patternUnits="userSpaceOnUse">
      <circle cx="108" cy="108" r="8" fill="#f68c50" fill-opacity="0.18"/>
      <circle cx="108" cy="108" r="2.8" fill="#f68c50" fill-opacity="0.95"/>
    </pattern>
    <!-- calm the pattern behind the text -->
    <linearGradient id="calm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#051230" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#051230" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#051230" stop-opacity="0"/>
    </linearGradient>
    <path id="paisley" fill-rule="evenodd" d="M17 1.5C9.5 3.5 3.5 9.5 3.5 15.2a8.2 8.2 0 0 0 16.4.6c0-3.3-2.3-5.600-5-5.400-2.500.2-3.800 2.400-3 4.200.7 1.500 2.500 1.800 3.500.8-1.600.5-3-.4-2.800-1.700.2-1.500 1.800-2.200 3-1.700 2 .9 2.500 3.500 1.200 5.600-1.800 2.800-5.800 3.300-8.500 1.300-3-2.200-3.500-6.500-1.300-10C8.600 6.500 12.500 3.800 17 1.500Z"/>
  </defs>

  <rect width="1280" height="640" fill="#051230"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#calm)"/>

  <!-- the hero network from banner.svg, on the right -->
  <g transform="translate(770 200) scale(0.84)">
    <g fill="none" stroke="#f68c50" stroke-width="1.8" stroke-dasharray="7 6" stroke-linecap="round" opacity="0.7">
      <path d="M120 220 C 190 150, 230 110, 300 120 S 410 220, 470 150 S 540 60, 575 90"/>
      <path d="M300 120 C 330 60, 380 40, 430 50"/>
      <path d="M470 150 C 500 200, 520 240, 560 250"/>
    </g>
    <circle cx="120" cy="220" r="16" fill="#f68c50" opacity="0.16"/><circle cx="120" cy="220" r="5" fill="#f68c50"/>
    <circle cx="300" cy="120" r="20" fill="#c9c47a" opacity="0.16"/><circle cx="300" cy="120" r="6" fill="#c9c47a"/>
    <circle cx="470" cy="150" r="18" fill="#f68c50" opacity="0.16"/><circle cx="470" cy="150" r="5.5" fill="#f68c50"/>
    <g fill="none" stroke="#eef0f5" stroke-width="1.4" opacity="0.55">
      <circle cx="430" cy="50" r="7"/><circle cx="575" cy="90" r="7"/><circle cx="560" cy="250" r="7"/>
    </g>
  </g>

  <!-- the mjesar mark, hanging from the top edge as in the website header -->
  <g transform="translate(90 0) scale(2)">
    <path fill="#f68c50" d="M0 0H32V46Q32 50 28 50H4Q0 50 0 46Z"/>
    <g transform="translate(5 20) scale(0.9167)" fill="#051230">
      <use href="#paisley"/>
      <circle cx="8.6" cy="15.5" r="1.3"/>
    </g>
  </g>
  <text x="182" y="72" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#f68c50">mjesar</text>

  <text x="86" y="318" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#eef0f5">Mohammad Ali Jesar</text>
  <text x="90" y="390" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="42" font-weight="500" fill="#f68c50">Senior Ruby on Rails Engineer</text>
  <text x="90" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#a9b2c8">Shopify &amp; E-commerce  ·  AI Agents, RAG &amp; MCP</text>

  <text x="90" y="572" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#eef0f5" fill-opacity="0.7">github.com/mjesar</text>
</svg>
