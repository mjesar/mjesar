<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Mohammad Ali Jesar, Ruby on Rails engineer for AI agents, RAG, MCP and Shopify</title>
  <desc id="d">Banner with the name Mohammad Ali Jesar and the line Ruby on Rails Engineer, AI Agents, RAG and MCP, Shopify and E-commerce.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5484d"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
