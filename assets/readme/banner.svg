<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">mjesar: Mohammad Ali Jesar, senior Ruby on Rails engineer for Shopify and e-commerce, AI agents, RAG and MCP</title>
  <desc id="d">Banner with the mjesar logo (an apricot tab with a paisley, as on mjesar.github.io), the name Mohammad Ali Jesar and the line Senior Ruby on Rails Engineer, Shopify and E-commerce, AI Agents, RAG and MCP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051230"/>
      <stop offset="1" stop-color="#0b1d45"/>
    </linearGradient>
    <path id="paisley" fill-rule="evenodd" d="M17 1.5C9.5 3.5 3.5 9.5 3.5 15.2a8.2 8.2 0 0 0 16.4.6c0-3.3-2.3-5.600-5-5.400-2.500.2-3.800 2.400-3 4.200.7 1.500 2.500 1.800 3.500.8-1.600.5-3-.4-2.800-1.700.2-1.500 1.800-2.200 3-1.700 2 .9 2.500 3.500 1.200 5.600-1.800 2.800-5.800 3.300-8.500 1.300-3-2.200-3.500-6.500-1.300-10C8.600 6.500 12.500 3.800 17 1.500Z"/>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- a large, faint paisley on the right -->
  <g transform="translate(860 18) scale(11.5)" fill="#f68c50" opacity="0.07">
    <use href="#paisley"/>
    <circle cx="8.6" cy="15.5" r="1.3"/>
  </g>

  <!-- the mjesar mark, hanging from the top edge as in the website header -->
  <g transform="translate(80 0) scale(1.25)">
    <path fill="#f68c50" d="M0 0H32V46Q32 50 28 50H4Q0 50 0 46Z"/>
    <g transform="translate(5 20) scale(0.9167)" fill="#051230">
      <use href="#paisley"/>
      <circle cx="8.6" cy="15.5" r="1.3"/>
    </g>
  </g>
  <text x="138" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0f6fc">mjesar</text>

  <text x="80" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f0f6fc">Mohammad Ali Jesar</text>
  <text x="80" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#c9d1d9">Senior Ruby on Rails Engineer</text>
  <text x="80" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">Shopify &amp; E-commerce<tspan fill="#f68c50">  ·  </tspan>AI Agents, RAG &amp; MCP</text>
</svg>
