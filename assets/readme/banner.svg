  <text x="80" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f0f6fc">Mohammad Ali Jesar</text>
  <text x="80" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#9ea7b3">Ruby on Rails Engineer</text>
  <text x="80" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#6e7681">AI Agents, RAG &amp; MCP  ·  Shopify, BigCommerce &amp; E-commerce</text>
</svg>
